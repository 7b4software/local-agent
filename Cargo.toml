[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.35"
rig = "0.47.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple_logger = { version = "5.2.0", features = ["stderr"] }
tokio = { version = "1.54.1", features = ["io-std", "macros", "process", "rt-multi-thread"] }
toml = "1.2.2"
